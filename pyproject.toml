[project]
name = "freshroute"
authors = [
    { name = "Your Company", email = "admin@freshroute.com" },
]
description = "Farm to Customer Distribution Platform"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "requests>=2.28.0",
    "twilio>=8.0.0",
    "paho-mqtt>=1.6.0",
    "reportlab>=4.0.0",
    "weasyprint>=59.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "freshroute"
