<div class="freshroute-dashboard">
  <div class="row">
    <div class="col-md-3">
      <div class="card stat-card" id="card-today-procurement">
        <div class="stat-label">Today's Procurement</div>
        <div class="stat-value" id="today-procurement-kg">— kg</div>
        <div class="stat-sub" id="today-procurement-amt">₹—</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card" id="card-pending-payments">
        <div class="stat-label">Pending Farmer Payments</div>
        <div class="stat-value" id="pending-farmer-payments">₹—</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card" id="card-customer-outstanding">
        <div class="stat-label">Customer Outstanding</div>
        <div class="stat-value" id="customer-outstanding">₹—</div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card" id="card-temp-alerts">
        <div class="stat-label">Temp Alerts Today</div>
        <div class="stat-value" id="temp-alerts">—</div>
      </div>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-md-6">
      <div class="card" id="card-dispatch-progress">
        <h6>Daily Dispatch Progress</h6>
        <div id="dispatch-progress-bar" class="progress">
          <div class="progress-bar bg-success" id="dispatch-bar" style="width:0%">0%</div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card" id="card-cs-utilisation">
        <h6>Cold Storage Utilisation</h6>
        <div id="cs-utilisation-chart"></div>
      </div>
    </div>
  </div>
</div>
