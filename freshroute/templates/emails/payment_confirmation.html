<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Payment Confirmation</title></head>
<body style="font-family:Arial,sans-serif;color:#212121;background:#f5f7f5;padding:20px;">
  <div style="max-width:600px;margin:auto;background:#fff;border-radius:10px;padding:30px;">
    <h2 style="color:#2e7d32;">✅ Payment Credited — FreshRoute</h2>
    <p>Dear {{ farmer_name }},</p>
    <p>Your payment has been processed successfully.</p>
    <table style="width:100%;margin:16px 0;border-collapse:collapse;">
      <tr><td style="padding:8px;color:#555;">Payment Reference</td><td style="padding:8px;font-weight:600;">{{ payment_id }}</td></tr>
      <tr style="background:#f9f9f9;"><td style="padding:8px;color:#555;">Amount</td><td style="padding:8px;font-weight:600;color:#2e7d32;">₹{{ net_payable }}</td></tr>
      <tr><td style="padding:8px;color:#555;">UTR Number</td><td style="padding:8px;">{{ utr_number }}</td></tr>
      <tr style="background:#f9f9f9;"><td style="padding:8px;color:#555;">Payment Date</td><td style="padding:8px;">{{ payment_date }}</td></tr>
      <tr><td style="padding:8px;color:#555;">Mode</td><td style="padding:8px;">{{ payment_mode }}</td></tr>
    </table>
    <p style="font-size:0.9rem;color:#555;">For queries, contact your field agent.</p>
  </div>
</body>
</html>
